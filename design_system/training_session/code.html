<body class="bg-background text-on-background font-body-lg min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- Top AppBar (JSON Component Mapping) -->
<header class="fixed top-0 w-full z-50 flex items-center px-container-padding h-16 justify-end bg-transparent">

<button class="material-symbols-outlined text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150" data-icon="settings">settings</button>
</header>
<main class="pt-24 pb-32 px-container-padding max-w-md mx-auto space-y-section-margin">
<!-- Live Session Status -->
<div class="flex justify-between items-end">
<div>
<span class="font-label-caps text-label-caps text-primary-fixed uppercase tracking-widest mb-1 block">Strength Training</span>
<h2 class="font-headline-md text-headline-md text-primary">Heavy Back Day</h2>
</div>
<div class="flex items-center gap-2 text-primary-fixed bg-primary-container/10 px-3 py-1 rounded-full border border-primary-container/20">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-fixed opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary-fixed"></span>
</span>
<span class="font-data-tabular text-data-tabular">LIVE</span>
</div>
</div>
<!-- Primary Metrics Display (Glassmorphism + Neon) -->
<section class="grid grid-cols-2 gap-grid-gutter">
<!-- Time Elapsed -->
<div class="col-span-2 glass-panel p-6 rounded-lg relative overflow-hidden group">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Time Elapsed</span>
<div class="mt-2 flex items-baseline gap-2">
<span class="font-display-metrics text-display-metrics text-primary glow-path" id="timer">00:42:58</span>
</div>
<span class="material-symbols-outlined absolute top-4 right-4 text-primary/20 group-hover:text-primary/40 transition-colors" data-icon="timer">timer</span>
</div>
<!-- Heart Rate -->
<div class="glass-panel p-6 rounded-lg group">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Heart Rate</span>
<div class="mt-2 flex items-baseline gap-1">
<span class="font-display-metrics text-[32px] text-secondary-fixed-dim animate-pulse-soft" id="hr">150</span>
<span class="font-label-caps text-label-caps text-secondary-fixed-dim/60">BPM</span>
</div>
<div class="mt-4 h-1 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-secondary-container w-3/4 rounded-full"></div>
</div>
</div>
<!-- Calories -->
<div class="glass-panel p-6 rounded-lg group">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Calories</span>
<div class="mt-2 flex items-baseline gap-1">
<span class="font-display-metrics text-[32px] text-primary-fixed">412</span>
<span class="font-label-caps text-label-caps text-primary-fixed/60">KCAL</span>
</div>
<div class="mt-4 h-1 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-fixed w-1/2 rounded-full shadow-[0_0_8px_rgba(161,251,0,0.5)]"></div>
</div>
</div>
</section>
<!-- Current Tracker Bento -->
<section class="space-y-4">
<h3 class="font-label-caps text-label-caps text-on-surface-variant px-1">ACTIVE SET</h3>
<div class="bg-surface-container rounded-lg p-1 border border-surface-variant/20">
<div class="grid grid-cols-2 gap-1">
<div class="bg-surface-container-high p-4 rounded-md text-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">SET</span>
<div class="font-display-metrics text-headline-lg text-primary mt-1">03<span class="text-on-surface-variant/30">/05</span></div>
</div>
<div class="bg-surface-container-high p-4 rounded-md text-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">REPS</span>
<div class="font-display-metrics text-headline-lg text-primary mt-1">08<span class="text-on-surface-variant/30">/12</span></div>
</div>
</div>
<div class="mt-1 bg-surface-container-high p-6 rounded-md flex justify-between items-center">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant">CURRENT WEIGHT</span>
<div class="font-headline-md text-headline-md text-primary-fixed">185 LBS</div>
</div>
<div class="flex gap-2">
<button class="w-12 h-12 flex items-center justify-center rounded-full border border-outline/20 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full border border-outline/20 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
</div>
</section>
<!-- Action Button -->
<section class="pt-4">
<button class="w-full bg-secondary-container hover:bg-secondary-container/90 text-primary font-headline-md text-headline-md py-6 rounded-lg active:scale-[0.98] transition-all duration-200 shadow-lg shadow-secondary-container/20 flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="stop_circle" style="font-variation-settings: 'FILL' 1;">stop_circle</span>
                End Workout
            </button>
</section>
</main>
<!-- Bottom NavBar (JSON Component Mapping) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-2 bg-background">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-caps text-label-caps mt-1">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="bolt">bolt</span>
<span class="font-label-caps text-label-caps mt-1">Generator</span>
</a>

<span class="material-symbols-outlined" data-icon="fitness_center" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<span class="font-label-caps text-label-caps mt-1">Session</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="show_chart">show_chart</span>
<span class="font-label-caps text-label-caps mt-1">Trends</span>
</a>
</nav>
<script>
        // Micro-interactions for live feeling
        const hrElement = document.getElementById('hr');
        const timerElement = document.getElementById('timer');
        
        let seconds = 2538; // Initial offset 42:18
        
        setInterval(() => {
            // Simulated HR fluctuation
            const baseHR = 148;
            const variance = Math.floor(Math.random() * 5) - 2;
            hrElement.textContent = baseHR + variance;
            
            // Timer logic
            seconds++;
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            timerElement.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }, 1000);
    </script>
