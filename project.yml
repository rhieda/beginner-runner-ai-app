name: Beginner-Runner-AI-Coach
options:
  bundleIdPrefix: com.rhieda

targets:
  Beginner-Runner-AI-Coach:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Beginner-Runner-AI-Coach
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rhieda.Beginner-Runner-AI-Coach
      DEVELOPMENT_ASSET_PATHS: '"Beginner-Runner-AI-Coach/Preview Content"'
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Beginner-Runner-AI-Coach/App/Info.plist
      properties:
        NSHealthShareUsageDescription: "The Beginner-Runner-AI-Coach app needs access to your HealthKit data to monitor your runs and progress."
        NSHealthUpdateUsageDescription: "The Beginner-Runner-AI-Coach app needs to save your running activities and performance metrics to HealthKit."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Beginner-Runner-AI-Coach/App/Beginner-Runner-AI-Coach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    capabilities:
      - healthKit: {}
    dependencies:
      - sdk: HealthKit.framework
      - sdk: SwiftData.framework
    preBuildScripts:
      - name: SwiftLint
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi

  Beginner-Runner-AI-CoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Beginner-Runner-AI-CoachTests
    dependencies:
      - target: Beginner-Runner-AI-Coach
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rhieda.Beginner-Runner-AI-CoachTests

  Beginner-Runner-AI-CoachUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Beginner-Runner-AI-CoachUITests
    dependencies:
      - target: Beginner-Runner-AI-Coach
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rhieda.Beginner-Runner-AI-CoachUITests

schemes:
  Beginner-Runner-AI-Coach:
    build:
      targets:
        Beginner-Runner-AI-Coach: all
    test:
      targets:
        - Beginner-Runner-AI-CoachTests
        - Beginner-Runner-AI-CoachUITests
    run:
      executable: Beginner-Runner-AI-Coach
